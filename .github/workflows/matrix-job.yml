name: Matrix Demo
on:
   push:
      branches:
         - main
         - dev
jobs:
   build:
      runs-on: ubuntu-latest
      steps:
         - name: Checout Code
           uses: actions/checkout@v3
         - name: Install Node
           uses: actions/setup-node@v3
           with:
              node-version: 20
         - name: List checkout files and node version
           run: |
              ls
              node --version
