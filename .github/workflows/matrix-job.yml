name: Matrix Demo
on:
   push:
      branches:
         - main
         - dev
jobs:
   build:
      runs-on: ubuntu-latest
      strategy:
         matrix:
            node-version: [18, 20]
      steps:
         - name: Checout Code
           uses: actions/checkout@v3
         - name: Install Node
           uses: actions/setup-node@v3
           with:
              node-version: ${{matrix.node-version}}
         - name: List checkout files and node version
           run: |
              ls
              node --version
         - name: Install Dependency
           run: yarn install --frozen-lockfile
         - name: Build
           run: yarn build
